<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeumoFlix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="dark">
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="app-shell">
    <aside class="sidebar droplet-panel">
      <div class="brand">
        <div class="brand-icon">◉</div>
        <div>
          <h1>NeumoFlix</h1>
          <p>Movies & TV</p>
        </div>
      </div>

      <nav class="side-nav">
        <a href="#/home" data-link><span>⌂</span><b>Home</b></a>
        <a href="#/discover" data-link><span>◈</span><b>Discover</b></a>
        <a href="#/tv" data-link><span>▣</span><b>TV Shows</b></a>
        <a href="#/search" data-link><span>⌕</span><b>Search</b></a>
        <a href="#/library" data-link><span>♡</span><b>Library</b></a>
        <a href="#/nations" data-link><span>◎</span><b>Nations</b></a>
      </nav>

      <div class="side-footer droplet-card">
        <p>Professional neumorphism UI</p>
        <small>Water droplet cards • TMDB powered</small>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar droplet-panel">
        <div class="topbar-left">
          <button class="icon-btn droplet-btn" id="menuToggle" aria-label="Toggle sidebar">☰</button>
          <div>
            <h2 id="pageTitle">Home</h2>
            <p id="pageSubtitle">Trending movies and TV</p>
          </div>
        </div>
        <div class="topbar-right">
          <button class="icon-btn droplet-btn" id="themeToggle" aria-label="Toggle theme">☼</button>
          <button class="icon-btn droplet-btn" id="refreshBtn" aria-label="Refresh">↻</button>
        </div>
      </header>

      <section id="heroMount"></section>
      <section id="view" class="view-grid"></section>
    </main>
  </div>

  <div id="watchModal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card droplet-panel">
      <button class="modal-close droplet-btn" data-close>✕</button>
      <div id="watchContent"></div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
